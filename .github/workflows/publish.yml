name: Publish

on:
  workflow_call:
    inputs:
      ref:
        description: Tag to publish, such as v0.1.0
        required: true
        type: string
    secrets:
      npm-token:
        required: false
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to publish, such as v0.1.0
        required: true

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm provenance and trusted publishing both authenticate the run through this identity.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      # No `registry-url`: that writes an `.npmrc` pointing at `${NODE_AUTH_TOKEN}`, which would
      # shadow trusted publishing with an empty bearer token.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: The tag must be the version being published
        env:
          REF: ${{ inputs.ref }}
        run: |
          tag="${REF#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $REF does not match package.json $version"
            exit 1
          fi

      - name: Skip a version that is already on the registry
        id: check
        env:
          REF: ${{ inputs.ref }}
        run: |
          name="$(node -p "require('./package.json').name")"
          if npm view "$name@${REF#v}" version >/dev/null 2>&1; then
            echo "::notice::$name@${REF#v} is already published"
            echo "publish=false" >>"$GITHUB_OUTPUT"
          else
            echo "publish=true" >>"$GITHUB_OUTPUT"
          fi

      # Until `npm trust github` is bound to this workflow the registry will not accept an OIDC
      # token, so the very first version needs a token. --userconfig keeps it out of the repository
      # and out of the runner's default npm config.
      - name: Publish with an npm token
        if: ${{ steps.check.outputs.publish == 'true' && secrets.npm-token != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-token }}
        run: |
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" >"$RUNNER_TEMP/.npmrc"
          npm publish --provenance --access public --userconfig "$RUNNER_TEMP/.npmrc"

      # The steady state: no secret anywhere, the run's OIDC identity is the credential.
      - name: Publish with trusted publishing
        if: ${{ steps.check.outputs.publish == 'true' && secrets.npm-token == '' }}
        run: npm publish --provenance --access public
