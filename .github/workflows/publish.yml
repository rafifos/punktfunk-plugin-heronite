name: Publish

on:
  workflow_call:
    inputs:
      ref:
        description: Tag to publish, such as v0.1.0
        required: true
        type: string
    secrets:
      npm-token:
        required: false
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to publish, such as v0.1.0
        required: true

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm provenance and trusted publishing both authenticate the run through this identity.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      # Node 24 for the npm line it carries: trusted publishing needs npm 11.5.1 or newer, and the
      # version bundled with a given image is not guaranteed. No `registry-url`: it writes an
      # `.npmrc` interpolating `${NODE_AUTH_TOKEN}`, and `publishConfig.registry` already names the
      # registry.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Use an npm that can use trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: The tag must be the version being published
        env:
          REF: ${{ inputs.ref }}
        run: |
          # Release Please names a package tag `<component>-v<version>` unless told otherwise, so
          # take the suffix after the last `v`: both `plugin-heronite-v0.1.0` and `v0.1.0` land on
          # the version.
          tag="${REF##*v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $REF does not match package.json $version"
            exit 1
          fi

      - name: Skip a version that is already on the registry
        id: check
        env:
          REF: ${{ inputs.ref }}
        run: |
          name="$(node -p "require('./package.json').name")"
          version="${REF##*v}"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::notice::$name@$version is already published"
            echo "publish=false" >>"$GITHUB_OUTPUT"
          else
            echo "publish=true" >>"$GITHUB_OUTPUT"
          fi

      # Until `npm trust github` is bound to this workflow the registry will not accept an OIDC
      # token, so the very first version needs one. `secrets` is not available in a step `if`, so
      # the shell decides: a --userconfig keeps the token out of the runner's default npm config,
      # and with no token the publish authenticates over the run's OIDC identity.
      - name: Publish
        if: steps.check.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-token }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" >"$RUNNER_TEMP/.npmrc"
            npm publish --provenance --access public --userconfig "$RUNNER_TEMP/.npmrc"
          else
            npm publish --provenance --access public
          fi
