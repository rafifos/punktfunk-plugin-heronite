name: Publish

on:
  workflow_call:
    inputs:
      ref:
        description: Tag to publish, such as v0.1.0
        required: true
        type: string
    secrets:
      npm-token:
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to publish, such as v0.1.0
        required: true

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `--provenance` signs the attestation with this run's GitHub identity. The registry
      # credential is the token below, and the two are separate.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      # `registry-url` writes the `.npmrc` that reads `NODE_AUTH_TOKEN`, which the publish step
      # supplies from the secret.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: The tag must be the version being published
        env:
          REF: ${{ inputs.ref }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${REF#v}" != "$version" ]; then
            echo "::error::tag $REF does not match package.json $version"
            exit 1
          fi

      - name: Skip a version that is already on the registry
        id: check
        env:
          REF: ${{ inputs.ref }}
        run: |
          name="$(node -p "require('./package.json').name")"
          version="${REF#v}"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::notice::$name@$version is already published"
            echo "publish=false" >>"$GITHUB_OUTPUT"
          else
            echo "publish=true" >>"$GITHUB_OUTPUT"
          fi

      # A token, not trusted publishing. This repository was created after 2026-07-15, so GitHub
      # issues the immutable OIDC subject form, `repo:<owner>@<id>/<repo>@<id>:ref:...`. The
      # registry cannot resolve that form to a trusted publisher and answers 404 with
      # "package not found". npm/cli#9969 tracks the defect, and GitHub ignores a request to go
      # back to the older subject format.
      #
      # `--provenance` still works: it uses this job's `id-token: write` for the Sigstore signing
      # certificate, which is independent of the registry credential.
      - name: Publish
        if: steps.check.outputs.publish == 'true'
        # `npm-token` arrives from release-please.yml. A hand-run dispatch has no caller, so it
        # reads the repository secret directly.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-token || secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::no npm token. Add the repository secret, then re-run: gh secret set NPM_TOKEN"
            exit 1
          fi
          npm publish --provenance --access public
